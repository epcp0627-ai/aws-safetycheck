name: Deploy static MVP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable live connector, SaaS onboarding, guided workflow, topology exporter, browser history, and UI enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          markers = [
              '<script src="./api-endpoint.js"></script>',
              '<script src="./live.js"></script>',
              '<script src="./report.js"></script>',
              '<script src="./live-bridge.js"></script>',
              '<script src="./live-badge.js"></script>',
              '<script src="./saas-mode.js"></script>',
              '<script src="./installer-guide.js"></script>',
              '<script src="./connection-ui.js"></script>',
              '<script src="./topology.js"></script>',
              '<script src="./ux.js"></script>',
              '<script src="./workflow-guide.js"></script>',
              '<script src="./workflow-nav.js"></script>',
              '<script src="./browser-history.js"></script>',
              '<script src="./ui-polish.js"></script>',
              '<script src="./hero-polish.js"></script>',
              '<script src="./typography.js"></script>',
              '<script src="./product-polish.js"></script>',
              '<script src="./readability-scale.js"></script>',
              '<script src="./audit-fixes.js"></script>',
              '<script src="./final-a11y-polish.js"></script>',
          ]
          for marker in markers:
              if marker not in text:
                  text = text.replace('</body>', marker + '</body>')
          p.write_text(text, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
