name: Deploy static MVP to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable live connector, report importer, and UI enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          markers = [
              '<script src="./live.js"></script>',
              '<script src="./report.js"></script>',
              '<script src="./live-bridge.js"></script>',
              '<script src="./live-account-fix.js"></script>',
              '<script src="./live-badge.js"></script>',
              '<script src="./ux.js"></script>',
              '<script src="./ui-polish.js"></script>',
              '<script src="./hero-polish.js"></script>',
          ]
          for marker in markers:
              if marker not in text:
                  text = text.replace('</body>', marker + '</body>')
          p.write_text(text, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
