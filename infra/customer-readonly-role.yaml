AWSTemplateFormatVersion: '2010-09-09'
Description: AWS SafetyCheck customer-side least-privilege read-only role. Customers deploy only this stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AWS SafetyCheck connection
        Parameters:
          - ExternalId
          - SafetyCheckAccountId
    ParameterLabels:
      ExternalId:
        default: External ID
      SafetyCheckAccountId:
        default: SafetyCheck service account ID

Parameters:
  SafetyCheckAccountId:
    Type: String
    Default: '369503741621'
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS account where the shared AWS SafetyCheck service runs. Keep the default unless the service operator tells you otherwise.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:_/-]+$'
    ConstraintDescription: Use 24-128 characters containing letters, numbers, and +=,.@:_/- only.
    Description: Unique random value for this customer account. Keep it private and enter the same value in AWS SafetyCheck.

Resources:
  SafetyCheckReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SafetyCheckReadOnlyRole
      MaxSessionDuration: 3600
      Description: Read-only role assumed by the shared AWS SafetyCheck service for live impact analysis.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${SafetyCheckAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: SafetyCheckLeastPrivilegeReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecurityHubRead
                Effect: Allow
                Action:
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:DescribeStandards
                  - securityhub:GetEnabledStandards
                  - securityhub:ListSecurityControlDefinitions
                Resource: '*'
              - Sid: EC2NetworkAndStorageRead
                Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInstances
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeAddresses
                  - ec2:GetEbsEncryptionByDefault
                Resource: '*'
              - Sid: RDSRead
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBSubnetGroups
                  - rds:DescribeDBSnapshots
                Resource: '*'
              - Sid: S3ConfigurationRead
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketEncryption
                  - s3:GetBucketLogging
                  - s3:GetBucketVersioning
                  - s3:GetLifecycleConfiguration
                Resource: '*'
              - Sid: S3AccountPublicAccessRead
                Effect: Allow
                Action:
                  - s3control:GetPublicAccessBlock
                Resource: '*'
              - Sid: CloudTrailAndCloudWatchRead
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - logs:DescribeLogGroups
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                Resource: '*'
              - Sid: IAMRead
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - iam:ListUsers
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                Resource: '*'
              - Sid: AccessAnalyzerRead
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                Resource: '*'
              - Sid: AccountContactRead
                Effect: Allow
                Action:
                  - account:GetAlternateContact
                Resource: '*'
              - Sid: KMSRead
                Effect: Allow
                Action:
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                Resource: '*'
              - Sid: AutoScalingAndELBRead
                Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeLaunchConfigurations
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeRules
                Resource: '*'
              - Sid: TaggingRead
                Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                Resource: '*'
              - Sid: IdentityRead
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'

Outputs:
  RoleArn:
    Description: Paste this value into AWS SafetyCheck.
    Value:
      Fn::GetAtt: [SafetyCheckReadOnlyRole, Arn]
  ConnectionMode:
    Description: Customer-side deployment mode
    Value: SharedSafetyCheckSaaS
