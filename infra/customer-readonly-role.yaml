AWSTemplateFormatVersion: '2010-09-09'
Description: AWS SafetyCheck customer-side read-only metadata role. Customers deploy only this stack.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AWS SafetyCheck connection
        Parameters:
          - ExternalId
          - SafetyCheckAccountId
    ParameterLabels:
      ExternalId:
        default: External ID
      SafetyCheckAccountId:
        default: SafetyCheck service account ID

Parameters:
  SafetyCheckAccountId:
    Type: String
    Default: '369503741621'
    AllowedPattern: '^[0-9]{12}$'
    Description: AWS account where the shared AWS SafetyCheck service runs. Keep the default unless the service operator tells you otherwise.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 24
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9+=,.@:_/-]+$'
    ConstraintDescription: Use 24-128 characters containing letters, numbers, and +=,.@:_/- only.
    Description: Unique random value for this customer account. Keep it private and enter the same value in AWS SafetyCheck.

Resources:
  SafetyCheckReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SafetyCheckReadOnlyRole
      MaxSessionDuration: 3600
      Description: Read-only metadata role assumed only by the AWS SafetyCheck service Lambda role.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:aws:iam::${SafetyCheckAccountId}:role/AWSSafetyCheckServiceLambdaRole
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: SafetyCheckReadOnlyMetadata
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecurityHubRead
                Effect: Allow
                Action:
                  - securityhub:GetFindings
                  - securityhub:DescribeHub
                  - securityhub:DescribeStandards
                  - securityhub:GetEnabledStandards
                  - securityhub:ListSecurityControlDefinitions
                Resource: '*'
              - Sid: EC2ArchitectureRead
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcPeeringConnections
                  - ec2:DescribeTransitGateways
                  - ec2:DescribeTransitGatewayAttachments
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInstances
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeImages
                  - ec2:DescribeAddresses
                  - ec2:GetEbsEncryptionByDefault
                Resource: '*'
              - Sid: LoadBalancerAndAutoScalingRead
                Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeLaunchConfigurations
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeRules
                Resource: '*'
              - Sid: DatabaseRead
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBClusters
                  - rds:DescribeDBSubnetGroups
                  - rds:DescribeDBSnapshots
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - elasticache:DescribeCacheSubnetGroups
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - redshift:DescribeClusters
                Resource: '*'
              - Sid: StorageRead
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketEncryption
                  - s3:GetBucketLogging
                  - s3:GetBucketVersioning
                  - s3:GetLifecycleConfiguration
                  - s3control:GetPublicAccessBlock
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargets
                Resource: '*'
              - Sid: EdgeAndDnsRead
                Effect: Allow
                Action:
                  - cloudfront:ListDistributions
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - route53:ListHostedZones
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - wafv2:ListWebACLs
                  - wafv2:GetWebACL
                  - wafv2:ListResourcesForWebACL
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                Resource: '*'
              - Sid: ServerlessAndContainersRead
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:GetFunctionConfiguration
                  - apigateway:GET
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - eks:ListClusters
                  - eks:DescribeCluster
                Resource: '*'
              - Sid: MessagingRead
                Effect: Allow
                Action:
                  - sns:ListTopics
                  - sns:GetTopicAttributes
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: '*'
              - Sid: CloudTrailAndCloudWatchRead
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:GetEventSelectors
                  - logs:DescribeLogGroups
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                Resource: '*'
              - Sid: IAMMetadataRead
                Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - iam:ListUsers
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                Resource: '*'
              - Sid: SecurityMetadataRead
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - account:GetAlternateContact
                  - kms:ListKeys
                  - kms:ListAliases
                  - kms:DescribeKey
                Resource: '*'
              - Sid: ResourceInventoryRead
                Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                Resource: '*'
              - Sid: IdentityRead
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'

Outputs:
  RoleArn:
    Description: Paste this value into AWS SafetyCheck.
    Value:
      Fn::GetAtt: [SafetyCheckReadOnlyRole, Arn]
  TrustedPrincipal:
    Description: Only this SafetyCheck service role may assume the customer role.
    Value:
      Fn::Sub: arn:aws:iam::${SafetyCheckAccountId}:role/AWSSafetyCheckServiceLambdaRole
  ConnectionMode:
    Description: Customer-side deployment mode
    Value: SharedSafetyCheckSaaS
  PermissionScope:
    Description: Permission model
    Value: ReadOnlyMetadata-NoCreateUpdateDeleteActions
