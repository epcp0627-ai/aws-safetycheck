AWSTemplateFormatVersion: '2010-09-09'
Description: AWS SafetyCheck shared SaaS service API. Deploy once in the SafetyCheck operator account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Service settings
        Parameters:
          - AllowedOrigin
          - TargetRegion
      - Label:
          default: Cost guardrails
        Parameters:
          - LogRetentionDays
          - LambdaReservedConcurrency
          - ApiThrottleRate
          - ApiThrottleBurst

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://epcp0627-ai.github.io
    Description: Browser origin allowed to call the shared SafetyCheck API.
  TargetRegion:
    Type: String
    Default: ap-northeast-1
    Description: AWS region analyzed in customer accounts.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
  LambdaReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: 0 disables reserved concurrency. Keep 0 on low-quota accounts.
  ApiThrottleRate:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Requests per second allowed by API Gateway.
  ApiThrottleBurst:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20

Conditions:
  UseReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, 0]]

Resources:
  SafetyCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AssumeSafetyCheckCustomerRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::*:role/SafetyCheckReadOnlyRole

  SafetyCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-safetycheck-api
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SafetyCheckLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref LambdaReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          TARGET_REGION: !Ref TargetRegion
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          import json,boto3,os,datetime,re
          REGION=os.environ.get('TARGET_REGION','ap-northeast-1')
          ALLOWED_ORIGIN=os.environ.get('ALLOWED_ORIGIN','')
          ROLE_RE=re.compile(r'^arn:aws:iam::\d{12}:role/SafetyCheckReadOnlyRole$')
          def resp(c,b): return {'statusCode':c,'headers':{'content-type':'application/json'},'body':json.dumps(b,ensure_ascii=False,default=str)}
          def allowed(e):
              h=e.get('headers') or {};o=h.get('origin') or h.get('Origin') or ''
              return bool(ALLOWED_ORIGIN) and o==ALLOWED_ORIGIN
          def assume(a,x=''):
              if not ROLE_RE.match(str(a)):raise ValueError('roleArn must point to SafetyCheckReadOnlyRole')
              if len(str(x))<24:raise ValueError('externalId must be at least 24 characters')
              q={'RoleArn':a,'RoleSessionName':'SafetyCheckReadOnly','DurationSeconds':900,'ExternalId':x}
              c=boto3.client('sts').assume_role(**q)['Credentials']
              return {'aws_access_key_id':c['AccessKeyId'],'aws_secret_access_key':c['SecretAccessKey'],'aws_session_token':c['SessionToken'],'region_name':REGION}
          def cli(n,c,r=None):
              q=dict(c)
              if r:q['region_name']=r
              return boto3.client(n,**q)
          def safe(f,d=None):
              try:return f(),None
              except Exception as e:return d,str(e)
          def name_tag(tags):
              for t in tags or []:
                  if t.get('Key')=='Name':return t.get('Value')
              return ''
          def ssl_deny(p):
              try:p=json.loads(p)
              except:return False
              s=p.get('Statement',[]);s=s if isinstance(s,list) else [s]
              for z in s:
                  if str(z.get('Effect','')).lower()!='deny':continue
                  c=z.get('Condition',{})
                  for op in ('Bool','StringEquals'):
                      if str((c.get(op) or {}).get('aws:SecureTransport','')).lower()=='false':return True
              return False
          def architecture(c,base):
              a={'coverage':'architecture-metadata-v1','region':REGION,'errors':{},'inventory':{}}
              ec2=cli('ec2',c)
              vpcs,e=safe(lambda:ec2.describe_vpcs().get('Vpcs',[]),[]);a['errors']['vpcs']=e if e else None
              subs,e=safe(lambda:ec2.describe_subnets().get('Subnets',[]),[]);a['errors']['subnets']=e if e else None
              inst,e=safe(lambda:[i for r in ec2.describe_instances().get('Reservations',[]) for i in r.get('Instances',[])],[]);a['errors']['instances']=e if e else None
              igws,_=safe(lambda:ec2.describe_internet_gateways().get('InternetGateways',[]),[])
              nats,_=safe(lambda:ec2.describe_nat_gateways().get('NatGateways',[]),[])
              a['vpcs']=[{'id':v.get('VpcId'),'cidr':v.get('CidrBlock'),'name':name_tag(v.get('Tags')),'default':v.get('IsDefault')} for v in vpcs or []]
              a['subnets']=[{'id':s.get('SubnetId'),'vpcId':s.get('VpcId'),'cidr':s.get('CidrBlock'),'az':s.get('AvailabilityZone'),'name':name_tag(s.get('Tags')),'publicIpOnLaunch':s.get('MapPublicIpOnLaunch')} for s in subs or []]
              a['instances']=[{'id':i.get('InstanceId'),'name':name_tag(i.get('Tags')),'type':i.get('InstanceType'),'state':(i.get('State') or {}).get('Name'),'vpcId':i.get('VpcId'),'subnetId':i.get('SubnetId'),'privateIp':i.get('PrivateIpAddress'),'publicIp':i.get('PublicIpAddress'),'securityGroups':[x.get('GroupId') for x in i.get('SecurityGroups',[])]} for i in (inst or [])[:100]]
              a['internetGateways']=[{'id':g.get('InternetGatewayId'),'vpcIds':[x.get('VpcId') for x in g.get('Attachments',[]) if x.get('State')=='available']} for g in igws or []]
              a['natGateways']=[{'id':n.get('NatGatewayId'),'vpcId':n.get('VpcId'),'subnetId':n.get('SubnetId'),'state':n.get('State'),'publicIps':[x.get('PublicIp') for x in n.get('NatGatewayAddresses',[]) if x.get('PublicIp')]} for n in (nats or [])[:50]]
              elb=cli('elbv2',c);lbs,_=safe(lambda:elb.describe_load_balancers().get('LoadBalancers',[]),[]);tgs,_=safe(lambda:elb.describe_target_groups().get('TargetGroups',[]),[])
              tgout=[]
              for t in (tgs or [])[:50]:
                  th,_=safe(lambda arn=t.get('TargetGroupArn'):elb.describe_target_health(TargetGroupArn=arn).get('TargetHealthDescriptions',[]),[])
                  tgout.append({'arn':t.get('TargetGroupArn'),'name':t.get('TargetGroupName'),'vpcId':t.get('VpcId'),'protocol':t.get('Protocol'),'port':t.get('Port'),'targetType':t.get('TargetType'),'loadBalancerArns':t.get('LoadBalancerArns',[]),'targets':[{'id':x.get('Target',{}).get('Id'),'port':x.get('Target',{}).get('Port'),'state':x.get('TargetHealth',{}).get('State')} for x in th or []]})
              a['loadBalancers']=[{'arn':l.get('LoadBalancerArn'),'name':l.get('LoadBalancerName'),'type':l.get('Type'),'scheme':l.get('Scheme'),'vpcId':l.get('VpcId'),'dns':l.get('DNSName'),'subnetIds':[z.get('SubnetId') for z in (l.get('AvailabilityZones') or [])],'securityGroups':l.get('SecurityGroups',[])} for l in (lbs or [])[:50]]
              a['targetGroups']=tgout
              asc=cli('autoscaling',c);ags,_=safe(lambda:asc.describe_auto_scaling_groups().get('AutoScalingGroups',[]),[])
              a['autoScalingGroups']=[{'name':g.get('AutoScalingGroupName'),'min':g.get('MinSize'),'max':g.get('MaxSize'),'desired':g.get('DesiredCapacity'),'instanceIds':[x.get('InstanceId') for x in g.get('Instances',[])],'targetGroupArns':g.get('TargetGroupARNs',[])} for g in (ags or [])[:50]]
              rds=cli('rds',c);dbs,_=safe(lambda:rds.describe_db_instances().get('DBInstances',[]),[])
              a['rds']=[{'id':d.get('DBInstanceIdentifier'),'engine':d.get('Engine'),'class':d.get('DBInstanceClass'),'multiAZ':d.get('MultiAZ'),'vpcId':(d.get('DBSubnetGroup') or {}).get('VpcId'),'subnetIds':[x.get('SubnetIdentifier') for x in ((d.get('DBSubnetGroup') or {}).get('Subnets') or [])],'securityGroups':[x.get('VpcSecurityGroupId') for x in d.get('VpcSecurityGroups',[])],'endpoint':(d.get('Endpoint') or {}).get('Address')} for d in (dbs or [])[:50]]
              s3=base.get('s3',{});a['s3']=[{'name':b.get('name'),'public':b.get('public')} for b in (s3.get('buckets') or [])]
              cf=cli('cloudfront',c,'us-east-1');dists,_=safe(lambda:((cf.list_distributions(MaxItems='100').get('DistributionList') or {}).get('Items') or []),[])
              a['cloudfront']=[{'id':d.get('Id'),'domain':d.get('DomainName'),'enabled':d.get('Enabled'),'webAclId':d.get('WebACLId'),'origins':[{'id':o.get('Id'),'domain':o.get('DomainName')} for o in ((d.get('Origins') or {}).get('Items') or [])]} for d in dists or []]
              r53=cli('route53',c,'us-east-1');zones,_=safe(lambda:r53.list_hosted_zones().get('HostedZones',[]),[]);a['route53']=[{'id':z.get('Id'),'name':z.get('Name'),'private':(z.get('Config') or {}).get('PrivateZone')} for z in (zones or [])[:100]]
              lam=cli('lambda',c);funcs,_=safe(lambda:lam.list_functions(MaxItems=100).get('Functions',[]),[]);a['lambda']=[{'name':f.get('FunctionName'),'runtime':f.get('Runtime'),'vpcId':(f.get('VpcConfig') or {}).get('VpcId'),'subnetIds':(f.get('VpcConfig') or {}).get('SubnetIds',[]),'securityGroups':(f.get('VpcConfig') or {}).get('SecurityGroupIds',[])} for f in funcs or []]
              ap=cli('apigateway',c);rest,_=safe(lambda:ap.get_rest_apis(limit=100).get('items',[]),[])
              ap2=cli('apigatewayv2',c);http,_=safe(lambda:ap2.get_apis(MaxResults='100').get('Items',[]),[])
              a['apiGateway']=[{'id':x.get('id'),'name':x.get('name'),'protocol':'REST'} for x in rest or []]+[{'id':x.get('ApiId'),'name':x.get('Name'),'protocol':x.get('ProtocolType')} for x in http or []]
              wafr=cli('wafv2',c);wr,_=safe(lambda:wafr.list_web_acls(Scope='REGIONAL',Limit=100).get('WebACLs',[]),[])
              wafg=cli('wafv2',c,'us-east-1');wg,_=safe(lambda:wafg.list_web_acls(Scope='CLOUDFRONT',Limit=100).get('WebACLs',[]),[])
              a['waf']=[{'name':w.get('Name'),'arn':w.get('ARN'),'scope':'REGIONAL'} for w in wr or []]+[{'name':w.get('Name'),'arn':w.get('ARN'),'scope':'CLOUDFRONT'} for w in wg or []]
              ec=cli('elasticache',c);caches,_=safe(lambda:ec.describe_cache_clusters().get('CacheClusters',[]),[]);a['elasticache']=[{'id':x.get('CacheClusterId'),'engine':x.get('Engine'),'subnetGroup':x.get('CacheSubnetGroupName')} for x in (caches or [])[:50]]
              efs=cli('efs',c);fss,_=safe(lambda:efs.describe_file_systems(MaxItems=100).get('FileSystems',[]),[]);a['efs']=[{'id':x.get('FileSystemId'),'name':x.get('Name')} for x in fss or []]
              ddb=cli('dynamodb',c);tabs,_=safe(lambda:ddb.list_tables(Limit=100).get('TableNames',[]),[]);a['dynamodb']=[{'name':x} for x in tabs or []]
              ecs=cli('ecs',c);ecl,_=safe(lambda:ecs.list_clusters(maxResults=100).get('clusterArns',[]),[]);a['ecs']=[{'arn':x,'name':x.rsplit('/',1)[-1]} for x in ecl or []]
              eks=cli('eks',c);ekl,_=safe(lambda:eks.list_clusters(maxResults=100).get('clusters',[]),[]);a['eks']=[{'name':x} for x in ekl or []]
              tag=cli('resourcegroupstaggingapi',c);counts={};arns=[]
              try:
                  pg=tag.get_paginator('get_resources').paginate(PaginationConfig={'MaxItems':500,'PageSize':100})
                  for p in pg:
                      for m in p.get('ResourceTagMappingList',[]):
                          arn=m.get('ResourceARN','');svc=arn.split(':')[2] if arn.startswith('arn:') and len(arn.split(':'))>2 else 'other';counts[svc]=counts.get(svc,0)+1
                          if len(arns)<300:arns.append(arn)
              except Exception as e:a['errors']['tagInventory']=str(e)
              a['inventory']={'taggedServiceCounts':counts,'taggedResourceArns':arns,'note':'Tagging API inventory includes tagged resources only; service-specific collectors cover key untagged architecture resources.'}
              return a
          def snapshot(c):
              out={'region':REGION,'errors':{}}
              ident,_=safe(lambda:cli('sts',c).get_caller_identity(),{});aid=(ident or {}).get('Account');out['account']=aid
              ec2=cli('ec2',c);ed={'defaultSecurityGroups':[],'adminOpen':[],'vpcsWithoutFlowLogs':[],'unencryptedVolumes':[]}
              vpcs,_=safe(lambda:ec2.describe_vpcs().get('Vpcs',[]),[]);sgs,_=safe(lambda:ec2.describe_security_groups().get('SecurityGroups',[]),[]);ed['vpcCount']=len(vpcs or [])
              cache={}
              def enis(g):
                  if g not in cache:cache[g]=(safe(lambda:ec2.describe_network_interfaces(Filters=[{'Name':'group-id','Values':[g]}]).get('NetworkInterfaces',[]),[])[0] or [])
                  return cache[g]
              for sg in sgs or []:
                  gid=sg.get('GroupId')
                  if sg.get('GroupName')=='default':
                      en=enis(gid);ed['defaultSecurityGroups'].append({'groupId':gid,'vpcId':sg.get('VpcId'),'ruleCount':len(sg.get('IpPermissions',[]))+len(sg.get('IpPermissionsEgress',[])),'enis':[{'id':x.get('NetworkInterfaceId'),'type':x.get('InterfaceType'),'description':x.get('Description')} for x in en[:10]]})
                  ports=[]
                  for p in sg.get('IpPermissions',[]):
                      pub=any(x.get('CidrIp')=='0.0.0.0/0' for x in p.get('IpRanges',[])) or any(x.get('CidrIpv6')=='::/0' for x in p.get('Ipv6Ranges',[]))
                      if not pub:continue
                      if p.get('IpProtocol')=='-1':ports += [22,3389]
                      elif p.get('FromPort') is not None:ports += [z for z in (22,3389) if p['FromPort']<=z<=p['ToPort']]
                  ports=sorted(set(ports))
                  if ports:ed['adminOpen'].append({'groupId':gid,'name':sg.get('GroupName'),'ports':ports,'eniCount':len(enis(gid))})
              fl,_=safe(lambda:ec2.describe_flow_logs().get('FlowLogs',[]),[]);active={x.get('ResourceId') for x in fl or [] if x.get('FlowLogStatus')=='ACTIVE'};ed['vpcsWithoutFlowLogs']=[v.get('VpcId') for v in vpcs or [] if v.get('VpcId') not in active]
              ed['ebsEncryptionDefault']=safe(lambda:ec2.get_ebs_encryption_by_default().get('EbsEncryptionByDefault'),None)[0]
              vols,_=safe(lambda:ec2.describe_volumes().get('Volumes',[]),[]);ed['unencryptedVolumes']=[{'id':v.get('VolumeId'),'size':v.get('Size')} for v in vols or [] if not v.get('Encrypted')][:30];out['ec2']=ed
              rds=cli('rds',c);dbs,_=safe(lambda:rds.describe_db_instances().get('DBInstances',[]),[]);out['rds']={'instances':[{'id':d.get('DBInstanceIdentifier'),'class':d.get('DBInstanceClass'),'engine':d.get('Engine'),'version':d.get('EngineVersion'),'storage':d.get('AllocatedStorage'),'multiAZ':d.get('MultiAZ'),'autoMinor':d.get('AutoMinorVersionUpgrade'),'publiclyAccessible':d.get('PubliclyAccessible'),'encrypted':d.get('StorageEncrypted')} for d in dbs or []]}
              s3=cli('s3',c);ct=cli('cloudtrail',c);trails,_=safe(lambda:ct.describe_trails(includeShadowTrails=False).get('trailList',[]),[]);tl=[]
              for t in trails or []:
                  st,_=safe(lambda a=t.get('TrailARN'):ct.get_trail_status(Name=a),{});b=t.get('S3BucketName');lg={}
                  if b:lg=safe(lambda b=b:s3.get_bucket_logging(Bucket=b),{})[0] or {}
                  tl.append({'name':t.get('Name'),'kmsKeyId':t.get('KmsKeyId'),'cloudWatchLogs':bool(t.get('CloudWatchLogsLogGroupArn')),'s3Bucket':b,'s3AccessLogging':bool(lg.get('LoggingEnabled')) if b else None,'logFileValidation':bool(t.get('LogFileValidationEnabled')),'isLogging':bool((st or {}).get('IsLogging'))})
              out['cloudtrail']={'trails':tl}
              buckets,_=safe(lambda:s3.list_buckets().get('Buckets',[]),[]);bl=[]
              for b in (buckets or [])[:40]:
                  n=b.get('Name');pol,_=safe(lambda n=n:s3.get_bucket_policy(Bucket=n),{});ps,_=safe(lambda n=n:s3.get_bucket_policy_status(Bucket=n),{});bp,_=safe(lambda n=n:s3.get_bucket_public_access_block(Bucket=n),{})
                  bl.append({'name':n,'sslEnforced':ssl_deny((pol or {}).get('Policy','')),'public':((ps or {}).get('PolicyStatus') or {}).get('IsPublic'),'bpa':(bp or {}).get('PublicAccessBlockConfiguration',{})})
              ab={}
              if aid:ab=safe(lambda:cli('s3control',c).get_public_access_block(AccountId=aid),{})[0] or {}
              out['s3']={'buckets':bl,'accountBpa':ab.get('PublicAccessBlockConfiguration',{}),'truncated':len(buckets or [])>40}
              iam=cli('iam',c);sm,_=safe(lambda:iam.get_account_summary().get('SummaryMap',{}),{});users,_=safe(lambda:iam.list_users().get('Users',[]),[]);old=[];now=datetime.datetime.now(datetime.timezone.utc)
              for u in (users or [])[:100]:
                  keys,_=safe(lambda n=u['UserName']:iam.list_access_keys(UserName=n).get('AccessKeyMetadata',[]),[])
                  for k in keys or []:
                      age=(now-k['CreateDate']).days
                      if age>90:old.append({'user':u['UserName'],'last4':k['AccessKeyId'][-4:],'ageDays':age,'status':k.get('Status')})
              ans,_=safe(lambda:cli('accessanalyzer',c).list_analyzers().get('analyzers',[]),[]);out['iam']={'accountMfa':bool((sm or {}).get('AccountMFAEnabled')),'rootAccessKeys':bool((sm or {}).get('AccountAccessKeysPresent')),'userCount':len(users or []),'oldAccessKeys':old[:40],'analyzers':[{'name':a.get('name'),'type':a.get('type'),'status':a.get('status')} for a in ans or []]}
              ac,_=safe(lambda:cli('account',c,'us-east-1').get_alternate_contact(AlternateContactType='SECURITY'),{});out['accountData']={'securityContact':bool((ac or {}).get('AlternateContact'))}
              out['topology']=architecture(c,out)
              return out
          def findings(c):
              sh=cli('securityhub',c);out=[]
              pg=sh.get_paginator('get_findings').paginate(Filters={'ComplianceStatus':[{'Value':'FAILED','Comparison':'EQUALS'}],'RecordState':[{'Value':'ACTIVE','Comparison':'EQUALS'}]},PaginationConfig={'MaxItems':100})
              for p in pg:
                  for f in p.get('Findings',[]):out.append({'id':f.get('Id'),'title':f.get('Title'),'severity':f.get('Severity',{}).get('Label'),'resources':[r.get('Id') for r in f.get('Resources',[])]})
              return out
          def lambda_handler(event,context):
              if not allowed(event):return resp(403,{'message':'origin not allowed'})
              try:
                  p=json.loads(event.get('body') or '{}');c=assume(p['roleArn'],p.get('externalId',''))
                  if p.get('action')=='snapshot':return resp(200,snapshot(c))
                  return resp(200,{'findings':findings(c)})
              except KeyError as e:return resp(400,{'message':'missing field: %s'%e})
              except ValueError as e:return resp(400,{'message':str(e)})
              except Exception as e:return resp(500,{'message':str(e)})

  SafetyCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/aws-safetycheck-api
      RetentionInDays: !Ref LogRetentionDays

  SafetyCheckApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aws-safetycheck-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
          - OPTIONS
        MaxAge: 600

  SafetyCheckIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SafetyCheckApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SafetyCheckFunction.Arn
      PayloadFormatVersion: '2.0'

  SafetyCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SafetyCheckApi
      RouteKey: POST /analyze
      Target: !Sub integrations/${SafetyCheckIntegration}

  SafetyCheckStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SafetyCheckApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottleRate
        ThrottlingBurstLimit: !Ref ApiThrottleBurst

  SafetyCheckInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SafetyCheckFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SafetyCheckApi}/*/*/analyze

Outputs:
  ApiUrl:
    Description: Shared SafetyCheck API endpoint used by the website.
    Value: !Sub https://${SafetyCheckApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/analyze
  ServiceAccountId:
    Description: Service account customers trust in customer-readonly-role.yaml.
    Value: !Ref AWS::AccountId
  DeploymentMode:
    Description: Service deployment mode
    Value: SharedSaaS
  CostGuardrails:
    Description: Enabled cost safety defaults
    Value: !Sub 'Logs=${LogRetentionDays}d, LambdaReservedConcurrency=${LambdaReservedConcurrency} (0=disabled), API=${ApiThrottleRate}rps burst=${ApiThrottleBurst}'
  SecurityGuardrail:
    Description: API limits calls to the configured browser origin and SafetyCheckReadOnlyRole + ExternalId.
    Value: OriginRestricted+ExternalId+RoleNameRestricted
  ArchitectureExport:
    Description: Live snapshot includes topology metadata for draw.io export.
    Value: AWS4DrawioSupported
