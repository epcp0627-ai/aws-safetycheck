AWSTemplateFormatVersion: '2010-09-09'
Description: AWS SafetyCheck shared SaaS API. Deploy once in the SafetyCheck operator account.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Service settings
        Parameters: [AllowedOrigin, TargetRegion]
      - Label:
          default: Cost guardrails
        Parameters: [LogRetentionDays, LambdaReservedConcurrency, ApiThrottleRate, ApiThrottleBurst]

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://epcp0627-ai.github.io
    Description: Browser origin allowed to call the shared SafetyCheck API.
  TargetRegion:
    Type: String
    Default: ap-northeast-1
    Description: Default AWS region analyzed in customer accounts.
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
  LambdaReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: 0 disables reserved concurrency.
  ApiThrottleRate:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  ApiThrottleBurst:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 20

Conditions:
  UseReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, 0]]

Resources:
  SafetyCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSSafetyCheckServiceLambdaRole
      Description: AWS SafetyCheck shared service Lambda role. Only assumes customer SafetyCheckReadOnlyRole roles.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AssumeSafetyCheckCustomerRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: arn:aws:iam::*:role/SafetyCheckReadOnlyRole

  SafetyCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-safetycheck-api
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SafetyCheckLambdaRole.Arn
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref LambdaReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          TARGET_REGION: !Ref TargetRegion
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          import json, boto3, os, datetime, re

          DEFAULT_REGION = os.environ.get('TARGET_REGION', 'ap-northeast-1')
          ALLOWED_ORIGIN = os.environ.get('ALLOWED_ORIGIN', '')
          ROLE_RE = re.compile(r'^arn:aws:iam::\d{12}:role/SafetyCheckReadOnlyRole$')

          def resp(code, body):
              return {'statusCode': code, 'headers': {'content-type': 'application/json'}, 'body': json.dumps(body, ensure_ascii=False, default=str)}

          def allowed(event):
              h = event.get('headers') or {}
              origin = h.get('origin') or h.get('Origin') or ''
              return bool(ALLOWED_ORIGIN) and origin == ALLOWED_ORIGIN

          def assume(role_arn, external_id):
              if not ROLE_RE.match(str(role_arn)):
                  raise ValueError('roleArn must point to SafetyCheckReadOnlyRole')
              if len(str(external_id or '')) < 24:
                  raise ValueError('externalId must be at least 24 characters')
              q = {'RoleArn': role_arn, 'RoleSessionName': 'SafetyCheckReadOnly', 'DurationSeconds': 900, 'ExternalId': external_id}
              c = boto3.client('sts').assume_role(**q)['Credentials']
              return {'aws_access_key_id': c['AccessKeyId'], 'aws_secret_access_key': c['SecretAccessKey'], 'aws_session_token': c['SessionToken']}

          def cli(name, creds, region=None):
              return boto3.client(name, region_name=region or DEFAULT_REGION, **creds)

          def safe(fn, default=None):
              try:
                  return fn(), None
              except Exception as e:
                  return default, str(e)

          def collect(client, operation, key, **kwargs):
              if client.can_paginate(operation):
                  out = []
                  for page in client.get_paginator(operation).paginate(**kwargs):
                      out.extend(page.get(key, []) or [])
                  return out
              return getattr(client, operation)(**kwargs).get(key, []) or []

          def name_tag(tags):
              for t in tags or []:
                  if t.get('Key') == 'Name':
                      return t.get('Value') or ''
              return ''

          def ssl_deny(policy_text):
              try:
                  p = json.loads(policy_text)
              except Exception:
                  return False
              stmts = p.get('Statement', [])
              stmts = stmts if isinstance(stmts, list) else [stmts]
              for s in stmts:
                  if str(s.get('Effect', '')).lower() != 'deny':
                      continue
                  cond = s.get('Condition', {})
                  for op in ('Bool', 'StringEquals'):
                      if str((cond.get(op) or {}).get('aws:SecureTransport', '')).lower() == 'false':
                          return True
              return False

          def region_list(creds):
              ec2 = cli('ec2', creds, DEFAULT_REGION)
              rows = ec2.describe_regions(AllRegions=False).get('Regions', [])
              return [{'name': r.get('RegionName'), 'optInStatus': r.get('OptInStatus')} for r in rows]

          def ec2_instances(ec2):
              out = []
              for p in ec2.get_paginator('describe_instances').paginate():
                  for r in p.get('Reservations', []):
                      out.extend(r.get('Instances', []))
              return out

          def global_inventory(creds, account_id):
              g = {'errors': {}}
              s3 = cli('s3', creds, DEFAULT_REGION)
              buckets, e = safe(lambda: s3.list_buckets().get('Buckets', []), [])
              g['errors']['s3'] = e
              detailed = []
              for b in buckets or []:
                  n = b.get('Name')
                  pol, _ = safe(lambda n=n: s3.get_bucket_policy(Bucket=n), {})
                  ps, _ = safe(lambda n=n: s3.get_bucket_policy_status(Bucket=n), {})
                  bp, _ = safe(lambda n=n: s3.get_bucket_public_access_block(Bucket=n), {})
                  detailed.append({'name': n, 'sslEnforced': ssl_deny((pol or {}).get('Policy', '')), 'public': ((ps or {}).get('PolicyStatus') or {}).get('IsPublic'), 'bpa': (bp or {}).get('PublicAccessBlockConfiguration', {})})
              account_bpa = {}
              if account_id:
                  account_bpa = (safe(lambda: cli('s3control', creds, DEFAULT_REGION).get_public_access_block(AccountId=account_id), {})[0] or {}).get('PublicAccessBlockConfiguration', {})
              g['s3'] = {'buckets': detailed, 'accountBpa': account_bpa, 'truncated': False}

              cf = cli('cloudfront', creds, 'us-east-1')
              dists = []
              try:
                  for p in cf.get_paginator('list_distributions').paginate():
                      dists.extend(((p.get('DistributionList') or {}).get('Items') or []))
              except Exception as e:
                  g['errors']['cloudfront'] = str(e)
              g['cloudfront'] = [{'id': d.get('Id'), 'domain': d.get('DomainName'), 'enabled': d.get('Enabled'), 'webAclId': d.get('WebACLId'), 'origins': [{'id': o.get('Id'), 'domain': o.get('DomainName')} for o in ((d.get('Origins') or {}).get('Items') or [])]} for d in dists]

              r53 = cli('route53', creds, 'us-east-1')
              zones, e = safe(lambda: collect(r53, 'list_hosted_zones', 'HostedZones'), [])
              g['errors']['route53'] = e
              g['route53'] = [{'id': z.get('Id'), 'name': z.get('Name'), 'private': (z.get('Config') or {}).get('PrivateZone')} for z in zones or []]

              iam = cli('iam', creds, 'us-east-1')
              summary, _ = safe(lambda: iam.get_account_summary().get('SummaryMap', {}), {})
              users, e = safe(lambda: collect(iam, 'list_users', 'Users'), [])
              g['errors']['iamUsers'] = e
              old = []
              now = datetime.datetime.now(datetime.timezone.utc)
              for u in users or []:
                  keys, _ = safe(lambda n=u.get('UserName'): iam.list_access_keys(UserName=n).get('AccessKeyMetadata', []), [])
                  for k in keys or []:
                      age = (now - k['CreateDate']).days
                      if age > 90:
                          old.append({'user': u.get('UserName'), 'last4': k.get('AccessKeyId', '')[-4:], 'ageDays': age, 'status': k.get('Status')})
              g['iam'] = {'accountMfa': bool((summary or {}).get('AccountMFAEnabled')), 'rootAccessKeys': bool((summary or {}).get('AccountAccessKeysPresent')), 'userCount': len(users or []), 'oldAccessKeys': old}

              contact, _ = safe(lambda: cli('account', creds, 'us-east-1').get_alternate_contact(AlternateContactType='SECURITY'), {})
              g['accountData'] = {'securityContact': bool((contact or {}).get('AlternateContact'))}
              return g

          def regional_inventory(creds, region):
              out = {'region': region, 'errors': {}}
              ec2 = cli('ec2', creds, region)
              vpcs, e = safe(lambda: collect(ec2, 'describe_vpcs', 'Vpcs'), []); out['errors']['vpcs'] = e
              subnets, e = safe(lambda: collect(ec2, 'describe_subnets', 'Subnets'), []); out['errors']['subnets'] = e
              sgs, e = safe(lambda: collect(ec2, 'describe_security_groups', 'SecurityGroups'), []); out['errors']['securityGroups'] = e
              enis, e = safe(lambda: collect(ec2, 'describe_network_interfaces', 'NetworkInterfaces'), []); out['errors']['networkInterfaces'] = e
              instances, e = safe(lambda: ec2_instances(ec2), []); out['errors']['instances'] = e
              routes, _ = safe(lambda: collect(ec2, 'describe_route_tables', 'RouteTables'), [])
              igws, _ = safe(lambda: collect(ec2, 'describe_internet_gateways', 'InternetGateways'), [])
              nats, _ = safe(lambda: collect(ec2, 'describe_nat_gateways', 'NatGateways'), [])
              endpoints, _ = safe(lambda: collect(ec2, 'describe_vpc_endpoints', 'VpcEndpoints'), [])
              flow, _ = safe(lambda: collect(ec2, 'describe_flow_logs', 'FlowLogs'), [])
              vols, _ = safe(lambda: collect(ec2, 'describe_volumes', 'Volumes'), [])

              eni_by_sg = {}
              for eni in enis or []:
                  for g in eni.get('Groups', []):
                      eni_by_sg.setdefault(g.get('GroupId'), []).append(eni)

              default_groups = []
              admin_open = []
              for sg in sgs or []:
                  gid = sg.get('GroupId')
                  attached = eni_by_sg.get(gid, [])
                  if sg.get('GroupName') == 'default':
                      default_groups.append({'groupId': gid, 'vpcId': sg.get('VpcId'), 'ruleCount': len(sg.get('IpPermissions', [])) + len(sg.get('IpPermissionsEgress', [])), 'enis': [{'id': x.get('NetworkInterfaceId'), 'type': x.get('InterfaceType'), 'description': x.get('Description')} for x in attached]})
                  ports = []
                  for p in sg.get('IpPermissions', []):
                      public = any(x.get('CidrIp') == '0.0.0.0/0' for x in p.get('IpRanges', [])) or any(x.get('CidrIpv6') == '::/0' for x in p.get('Ipv6Ranges', []))
                      if not public:
                          continue
                      if p.get('IpProtocol') == '-1':
                          ports += [22, 3389]
                      elif p.get('FromPort') is not None:
                          ports += [z for z in (22, 3389) if p['FromPort'] <= z <= p['ToPort']]
                  if ports:
                      admin_open.append({'groupId': gid, 'name': sg.get('GroupName'), 'ports': sorted(set(ports)), 'eniCount': len(attached), 'region': region})

              active_flow = {x.get('ResourceId') for x in flow or [] if x.get('FlowLogStatus') == 'ACTIVE'}
              ec2_data = {
                  'region': region,
                  'vpcCount': len(vpcs or []),
                  'defaultSecurityGroups': default_groups,
                  'adminOpen': admin_open,
                  'vpcsWithoutFlowLogs': [v.get('VpcId') for v in vpcs or [] if v.get('VpcId') not in active_flow],
                  'ebsEncryptionDefault': safe(lambda: ec2.get_ebs_encryption_by_default().get('EbsEncryptionByDefault'), None)[0],
                  'unencryptedVolumes': [{'id': v.get('VolumeId'), 'size': v.get('Size'), 'region': region} for v in vols or [] if not v.get('Encrypted')]
              }
              out['ec2'] = ec2_data

              rds = cli('rds', creds, region)
              dbs, e = safe(lambda: collect(rds, 'describe_db_instances', 'DBInstances'), []); out['errors']['rds'] = e
              out['rds'] = {'instances': [{'id': d.get('DBInstanceIdentifier'), 'class': d.get('DBInstanceClass'), 'engine': d.get('Engine'), 'version': d.get('EngineVersion'), 'storage': d.get('AllocatedStorage'), 'multiAZ': d.get('MultiAZ'), 'autoMinor': d.get('AutoMinorVersionUpgrade'), 'publiclyAccessible': d.get('PubliclyAccessible'), 'encrypted': d.get('StorageEncrypted'), 'region': region} for d in dbs or []]}

              ct = cli('cloudtrail', creds, region)
              trails, e = safe(lambda: ct.describe_trails(includeShadowTrails=False).get('trailList', []), []); out['errors']['cloudtrail'] = e
              trail_rows = []
              s3 = cli('s3', creds, region)
              for t in trails or []:
                  status, _ = safe(lambda arn=t.get('TrailARN'): ct.get_trail_status(Name=arn), {})
                  bucket = t.get('S3BucketName'); logging = {}
                  if bucket:
                      logging = safe(lambda b=bucket: s3.get_bucket_logging(Bucket=b), {})[0] or {}
                  trail_rows.append({'name': t.get('Name'), 'kmsKeyId': t.get('KmsKeyId'), 'cloudWatchLogs': bool(t.get('CloudWatchLogsLogGroupArn')), 's3Bucket': bucket, 's3AccessLogging': bool(logging.get('LoggingEnabled')) if bucket else None, 'logFileValidation': bool(t.get('LogFileValidationEnabled')), 'isLogging': bool((status or {}).get('IsLogging')), 'region': region})
              out['cloudtrail'] = {'trails': trail_rows}

              analyzer, _ = safe(lambda: collect(cli('accessanalyzer', creds, region), 'list_analyzers', 'analyzers'), [])
              out['accessAnalyzers'] = [{'name': a.get('name'), 'type': a.get('type'), 'status': a.get('status'), 'region': region} for a in analyzer or []]

              elb = cli('elbv2', creds, region)
              lbs, _ = safe(lambda: collect(elb, 'describe_load_balancers', 'LoadBalancers'), [])
              tgs, _ = safe(lambda: collect(elb, 'describe_target_groups', 'TargetGroups'), [])
              tg_rows = []
              for t in tgs or []:
                  health, _ = safe(lambda arn=t.get('TargetGroupArn'): elb.describe_target_health(TargetGroupArn=arn).get('TargetHealthDescriptions', []), [])
                  tg_rows.append({'arn': t.get('TargetGroupArn'), 'name': t.get('TargetGroupName'), 'vpcId': t.get('VpcId'), 'protocol': t.get('Protocol'), 'port': t.get('Port'), 'targetType': t.get('TargetType'), 'loadBalancerArns': t.get('LoadBalancerArns', []), 'targets': [{'id': x.get('Target', {}).get('Id'), 'port': x.get('Target', {}).get('Port'), 'state': x.get('TargetHealth', {}).get('State')} for x in health or []], 'region': region})

              asc = cli('autoscaling', creds, region)
              asgs, _ = safe(lambda: collect(asc, 'describe_auto_scaling_groups', 'AutoScalingGroups'), [])
              lamb = cli('lambda', creds, region)
              funcs, _ = safe(lambda: collect(lamb, 'list_functions', 'Functions'), [])
              cache = cli('elasticache', creds, region)
              caches, _ = safe(lambda: collect(cache, 'describe_cache_clusters', 'CacheClusters'), [])
              efs = cli('efs', creds, region)
              fss, _ = safe(lambda: collect(efs, 'describe_file_systems', 'FileSystems'), [])
              ddb = cli('dynamodb', creds, region)
              tables, _ = safe(lambda: collect(ddb, 'list_tables', 'TableNames'), [])
              ecs = cli('ecs', creds, region)
              ecs_clusters, _ = safe(lambda: collect(ecs, 'list_clusters', 'clusterArns'), [])
              eks = cli('eks', creds, region)
              eks_clusters, _ = safe(lambda: collect(eks, 'list_clusters', 'clusters'), [])

              topo = {
                  'coverage': 'architecture-metadata-v2-paginated', 'region': region,
                  'vpcs': [{'id': v.get('VpcId'), 'cidr': v.get('CidrBlock'), 'name': name_tag(v.get('Tags')), 'default': v.get('IsDefault'), 'region': region} for v in vpcs or []],
                  'subnets': [{'id': s.get('SubnetId'), 'vpcId': s.get('VpcId'), 'cidr': s.get('CidrBlock'), 'az': s.get('AvailabilityZone'), 'name': name_tag(s.get('Tags')), 'publicIpOnLaunch': s.get('MapPublicIpOnLaunch'), 'region': region} for s in subnets or []],
                  'routeTables': [{'id': r.get('RouteTableId'), 'vpcId': r.get('VpcId'), 'associations': r.get('Associations', []), 'routes': r.get('Routes', []), 'region': region} for r in routes or []],
                  'instances': [{'id': i.get('InstanceId'), 'name': name_tag(i.get('Tags')), 'type': i.get('InstanceType'), 'state': (i.get('State') or {}).get('Name'), 'vpcId': i.get('VpcId'), 'subnetId': i.get('SubnetId'), 'privateIp': i.get('PrivateIpAddress'), 'publicIp': i.get('PublicIpAddress'), 'securityGroups': [x.get('GroupId') for x in i.get('SecurityGroups', [])], 'region': region} for i in instances or []],
                  'internetGateways': [{'id': g.get('InternetGatewayId'), 'vpcIds': [x.get('VpcId') for x in g.get('Attachments', []) if x.get('State') == 'available'], 'region': region} for g in igws or []],
                  'natGateways': [{'id': n.get('NatGatewayId'), 'vpcId': n.get('VpcId'), 'subnetId': n.get('SubnetId'), 'state': n.get('State'), 'publicIps': [x.get('PublicIp') for x in n.get('NatGatewayAddresses', []) if x.get('PublicIp')], 'region': region} for n in nats or []],
                  'vpcEndpoints': [{'id': x.get('VpcEndpointId'), 'vpcId': x.get('VpcId'), 'serviceName': x.get('ServiceName'), 'type': x.get('VpcEndpointType'), 'subnetIds': x.get('SubnetIds', []), 'region': region} for x in endpoints or []],
                  'loadBalancers': [{'arn': l.get('LoadBalancerArn'), 'name': l.get('LoadBalancerName'), 'type': l.get('Type'), 'scheme': l.get('Scheme'), 'vpcId': l.get('VpcId'), 'dns': l.get('DNSName'), 'subnetIds': [z.get('SubnetId') for z in (l.get('AvailabilityZones') or [])], 'securityGroups': l.get('SecurityGroups', []), 'region': region} for l in lbs or []],
                  'targetGroups': tg_rows,
                  'autoScalingGroups': [{'name': g.get('AutoScalingGroupName'), 'min': g.get('MinSize'), 'max': g.get('MaxSize'), 'desired': g.get('DesiredCapacity'), 'instanceIds': [x.get('InstanceId') for x in g.get('Instances', [])], 'targetGroupArns': g.get('TargetGroupARNs', []), 'region': region} for g in asgs or []],
                  'rds': [{'id': d.get('DBInstanceIdentifier'), 'engine': d.get('Engine'), 'class': d.get('DBInstanceClass'), 'multiAZ': d.get('MultiAZ'), 'vpcId': (d.get('DBSubnetGroup') or {}).get('VpcId'), 'subnetIds': [x.get('SubnetIdentifier') for x in ((d.get('DBSubnetGroup') or {}).get('Subnets') or [])], 'securityGroups': [x.get('VpcSecurityGroupId') for x in d.get('VpcSecurityGroups', [])], 'endpoint': (d.get('Endpoint') or {}).get('Address'), 'region': region} for d in dbs or []],
                  'lambda': [{'name': f.get('FunctionName'), 'runtime': f.get('Runtime'), 'vpcId': (f.get('VpcConfig') or {}).get('VpcId'), 'subnetIds': (f.get('VpcConfig') or {}).get('SubnetIds', []), 'securityGroups': (f.get('VpcConfig') or {}).get('SecurityGroupIds', []), 'region': region} for f in funcs or []],
                  'elasticache': [{'id': x.get('CacheClusterId'), 'engine': x.get('Engine'), 'subnetGroup': x.get('CacheSubnetGroupName'), 'region': region} for x in caches or []],
                  'efs': [{'id': x.get('FileSystemId'), 'name': x.get('Name'), 'region': region} for x in fss or []],
                  'dynamodb': [{'name': x, 'region': region} for x in tables or []],
                  'ecs': [{'arn': x, 'name': x.rsplit('/', 1)[-1], 'region': region} for x in ecs_clusters or []],
                  'eks': [{'name': x, 'region': region} for x in eks_clusters or []]
              }
              out['topology'] = topo
              return out

          def snapshot(creds, region, include_global=True):
              ident, _ = safe(lambda: cli('sts', creds, region).get_caller_identity(), {})
              account_id = (ident or {}).get('Account')
              reg = regional_inventory(creds, region)
              out = {'account': account_id, 'region': region, 'errors': reg.get('errors', {}), 'ec2': reg.get('ec2', {}), 'rds': reg.get('rds', {}), 'cloudtrail': reg.get('cloudtrail', {}), 'topology': reg.get('topology', {})}
              out['iam'] = {'analyzers': reg.get('accessAnalyzers', [])}
              if include_global:
                  glob = global_inventory(creds, account_id)
                  out['s3'] = glob.get('s3', {})
                  out['accountData'] = glob.get('accountData', {})
                  out['iam'].update(glob.get('iam', {}))
                  out['topology']['s3'] = [{'name': b.get('name'), 'public': b.get('public')} for b in out['s3'].get('buckets', [])]
                  out['topology']['cloudfront'] = glob.get('cloudfront', [])
                  out['topology']['route53'] = glob.get('route53', [])
                  out['errors'].update({k: v for k, v in glob.get('errors', {}).items() if v})
              else:
                  out['s3'] = {'buckets': [], 'accountBpa': {}, 'truncated': False}
                  out['accountData'] = {}
              return out

          def findings(creds, region):
              sh = cli('securityhub', creds, region)
              rows = []
              pg = sh.get_paginator('get_findings').paginate(Filters={'ComplianceStatus': [{'Value': 'FAILED', 'Comparison': 'EQUALS'}], 'RecordState': [{'Value': 'ACTIVE', 'Comparison': 'EQUALS'}]}, PaginationConfig={'PageSize': 100})
              for p in pg:
                  for f in p.get('Findings', []):
                      rows.append({'id': f.get('Id'), 'title': f.get('Title'), 'severity': f.get('Severity', {}).get('Label'), 'resources': [r.get('Id') for r in f.get('Resources', [])]})
              return rows

          def lambda_handler(event, context):
              if not allowed(event):
                  return resp(403, {'message': 'origin not allowed'})
              try:
                  p = json.loads(event.get('body') or '{}')
                  creds = assume(p['roleArn'], p.get('externalId', ''))
                  action = p.get('action', 'snapshot')
                  region = p.get('region') or DEFAULT_REGION
                  if action == 'regions':
                      return resp(200, {'defaultRegion': DEFAULT_REGION, 'regions': region_list(creds)})
                  if action == 'snapshot':
                      return resp(200, snapshot(creds, region, bool(p.get('includeGlobal', True))))
                  if action == 'findings':
                      return resp(200, {'region': region, 'findings': findings(creds, region)})
                  return resp(400, {'message': 'unsupported action'})
              except KeyError as e:
                  return resp(400, {'message': 'missing field: %s' % e})
              except ValueError as e:
                  return resp(400, {'message': str(e)})
              except Exception as e:
                  return resp(500, {'message': str(e)})

  SafetyCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/aws-safetycheck-api
      RetentionInDays: !Ref LogRetentionDays

  SafetyCheckApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aws-safetycheck-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [content-type]
        AllowMethods: [POST, OPTIONS]
        MaxAge: 600

  SafetyCheckIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SafetyCheckApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SafetyCheckFunction.Arn
      PayloadFormatVersion: '2.0'

  SafetyCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SafetyCheckApi
      RouteKey: POST /analyze
      Target: !Sub integrations/${SafetyCheckIntegration}

  SafetyCheckStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SafetyCheckApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottleRate
        ThrottlingBurstLimit: !Ref ApiThrottleBurst

  SafetyCheckInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SafetyCheckFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SafetyCheckApi}/*/*/analyze

Outputs:
  ApiUrl:
    Description: Shared SafetyCheck API endpoint used by the website.
    Value: !Sub https://${SafetyCheckApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/analyze
  ServiceAccountId:
    Description: Service account customers trust in customer-readonly-role.yaml.
    Value: !Ref AWS::AccountId
  ServicePrincipalArn:
    Description: Exact principal trusted by customer SafetyCheckReadOnlyRole.
    Value: !GetAtt SafetyCheckLambdaRole.Arn
  DeploymentMode:
    Value: SharedSaaS
  InventoryMode:
    Value: PaginatedPerRegion+GlobalMetadata
  CostGuardrails:
    Value: !Sub 'Logs=${LogRetentionDays}d, LambdaReservedConcurrency=${LambdaReservedConcurrency}, API=${ApiThrottleRate}rps burst=${ApiThrottleBurst}'
